/* ---------- inspector ---------- */
function crumbs(n){const out=[];for(let p=n;p;p=p.parent?byId[p.parent]:null)out.unshift(p);return out;}
const label=n=>n===root?'Network':n.kind==='gate'?n.head.id+' gate':(n.parent==='tail'&&n.head?n.head.id+': ':'')+n.name.split(' · ')[0];
function codeHtml(key){const c=D.code[key];if(!c)return'';const body=c[1].split('\n').map(l=>{const e=esc(l),i=e.search(/(^|\s)#(?![^"]*"[^"]*$)/);return i<0?e:e.slice(0,i)+'<span class="c">'+e.slice(i)+'</span>';}).join('\n');
  const nt=CN[key]?'<div class="rd"><h4>Reading this code</h4><ul>'+CN[key].map(q=>`<li><code>${esc(q[0])}</code> ${q[1]}</li>`).join('')+'</ul></div>':'';
  return `<details class="src" open><summary>From the code · <b>${c[0]}</b></summary><pre>${body}</pre>${nt}</details>`;}
function render(){const key=(demo?demo.i:-1)+phase+mode+scen;if(shown===focus&&shownKey===key)return;shown=focus;shownKey=key;const n=focus||root;
  const I=(INFO[n.info]||INFO.net)(n);let h='';
  if(demo){const s=demo.steps[demo.i];h+=`<div class="demo"><div class="row"><b>Following one tile · step ${demo.i+1} of ${demo.steps.length}</b><button id="dPrev" ${demo.i?'':'disabled'}>Back</button><button id="dNext" class="nx">${demo.i<demo.steps.length-1?'Next':'Finish'}</button><button id="dEnd" aria-label="End the walkthrough">✕</button></div><h4>${s[1]}</h4><p>${s[2]}</p></div>`;}
  const par=n.parent?byId[n.parent]:null,sib=par?par.children:[],si=sib.indexOf(n);
  h+='<div class="top"><div class="crumb">'+crumbs(n).map((c,i,a)=>i<a.length-1?`<button data-go="${c.id}">${label(c)}</button>`:`<span>${label(c)}</span>`).join(' › ')+'</div>'+
     (par?`<div class="nav"><button data-go="${si>0?sib[si-1].id:''}" ${si>0?'':'disabled'} aria-label="Previous part">◀</button><button data-go="${par.id}" aria-label="Zoom out one level">▲</button><button data-go="${si<sib.length-1?sib[si+1].id:''}" ${si<sib.length-1?'':'disabled'} aria-label="Next part">▶</button></div>`:'')+'</div>';
  h+=`<h2>${I.title}</h2>`;if(I.pnote)h+=I.pnote;
  h+=`<h3>What it does</h3>${I.what}`;
  if(n.children.length)h+='<h3>Inside this part</h3><div class="kids">'+n.children.filter(c=>c.kind!=='gate').map(c=>`<button data-go="${c.id}">${label(c)}</button>`).join('')+'</div>';
  if(I.maps){h+='<div class="strip">'+I.maps.map((m,i)=>`<figure><canvas data-map="${i}" width="104" height="104"></canvas><figcaption>${m[1]}</figcaption></figure>`).join('')+'</div>';if(I.mapNote)h+=`<p class="note">${I.mapNote}</p>`;}
  if(I.after)h+=I.after;
  const wide=I.plot==='lever'||I.plot==='vta';
  if(I.plot)h+=`<canvas class="plot" id="plotc" style="height:${I.small?96:wide?170:150}px;${wide?'max-width:none':''}"></canvas>`+(I.plotCap?`<p class="note">${I.plotCap}</p>`:'');
  h+=`<div class="why"><h3>Why we chose it</h3>${I.why}</div>`;
  if(I.facts)h+='<h3>Numbers</h3><dl class="facts">'+I.facts.map(f=>`<dt>${f[0]}</dt><dd>${f[1]}</dd>`).join('')+'</dl>';
  if(I.src)h+=I.src.map(codeHtml).join('');
  if(I.extra)h+=I.extra;
  const sk=n.id+'|'+(demo?demo.i:'')+'|'+phase+mode,keep=sk===scrollKey?insp.scrollTop:0;scrollKey=sk;
  insp.innerHTML=h;insp.scrollTop=keep;
  if(I.maps)insp.querySelectorAll('canvas[data-map]').forEach(c=>{const g=c.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(I.maps[+c.dataset.map][0],0,0,104,104);});
  if(I.plot){const c=$('plotc'),r=c.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);c.width=r.width*d;c.height=r.height*d;const g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);plot(g,I.plot,8,8,r.width-16,r.height-16,C[n.col]||C.bb,true);}
  insp.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(!b.dataset.go)return;endDemo();go(byId[b.dataset.go]);});
  insp.querySelectorAll('tr[data-scen]').forEach(r=>r.onclick=()=>setScen(+r.dataset.scen));
  if(demo){$('dPrev').onclick=()=>stepDemo(-1);$('dNext').onclick=()=>stepDemo(1);$('dEnd').onclick=()=>{endDemo();go(root);};}
  let on='net';for(const c of crumbs(n))if(chipList.some(k=>k[0]===c.id))on=c.id;
  document.querySelectorAll('#chips button').forEach(b=>{const is=b.dataset.id===on;b.classList.toggle('on',is);if(is&&b.scrollIntoView)b.scrollIntoView({block:'nearest',inline:'nearest'});});}

/* ---------- walkthrough, scenario, phase, model ---------- */
function showStep(prev){const n=byId[demo.steps[demo.i][0]];pinned=n;setFocus(n);shownKey='';fly(target(n),900);
  if(anim&&prev)anim.pulse={x0:prev.x+prev.w/2,y0:prev.y+prev.h/2,x1:n.x+n.w/2,y1:n.y+n.h/2};dirty=true;}
function startDemo(){demo={i:0,steps:steps()};$('demoBtn').textContent='■ End walkthrough';$('hint').hidden=true;showStep(null);}
function endDemo(){if(!demo)return;demo=null;pulse=null;$('demoBtn').textContent='▶ Follow one tile';shownKey='';dirty=true;}
function stepDemo(d){if(!demo)return;const prev=byId[demo.steps[demo.i][0]],i=demo.i+d;if(i>=demo.steps.length){endDemo();go(root);return;}if(i<0)return;demo.i=i;showStep(prev);}
function setScen(i){if(scen===i)return;scen=i;nodes.forEach(n=>{if(n.kind==='dense')n.act=acts(n.id,n.count);});
  document.querySelectorAll('#pick button').forEach((b,k)=>b.setAttribute('aria-pressed',k===i));
  if(demo){const at=demo.i;demo.steps=steps();demo.i=Math.min(at,demo.steps.length-1);const n=byId[demo.steps[demo.i][0]];pinned=n;setFocus(n);fly(target(n),400);}
  else if(focus&&focus.scen!==undefined&&focus.scen!==i){const n=byId['ds'+i];pinned=n;setFocus(n);fly(target(n),400);}
  shownKey='';dirty=true;}
function rebuild(){endDemo();const id=focus?focus.id:null;build();resize();shown=null;shownKey='';const n=(id&&byId[id])||root;pinned=n;focus=n;fly(target(n),0);}
function setMode(m){if(mode===m)return;mode=m;document.querySelectorAll('#modelSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));rebuild();}
function setPhase(p){if(phase===p)return;phase=p;document.querySelectorAll('#phaseSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===p));rebuild();}
document.querySelectorAll('#modelSeg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
document.querySelectorAll('#phaseSeg button').forEach(b=>b.onclick=()=>setPhase(b.dataset.p));
SC.forEach((S,i)=>{const b=document.createElement('button'),c=document.createElement('canvas');c.width=c.height=76;c.getContext('2d').drawImage(S.img,0,0,76,76);b.appendChild(c);
  b.title=`${S.key} (${S.ds})`;b.setAttribute('aria-label',`Example tile: ${S.key}, from ${S.ds}`);b.setAttribute('aria-pressed',i===0);b.onclick=()=>setScen(i);$('pick').appendChild(b);});

/* ---------- input ---------- */
const pts=new Map();let gest=null;
function userMoved(){if(!demo)pinned=null;$('hint').hidden=true;}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY});anim=null;
  if(pts.size===1)gest={t:performance.now(),moved:0};else if(pts.size===2){const p=[...pts.values()];gest={pinch:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),moved:99};}});
cv.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;const dx=e.offsetX-p.x,dy=e.offsetY-p.y;p.x=e.offsetX;p.y=e.offsetY;
  if(pts.size===1&&gest){gest.moved+=Math.abs(dx)+Math.abs(dy);if(gest.moved>6){cam.x-=dx/cam.s;cam.y-=dy/cam.s;userMoved();dirty=true;}}
  else if(pts.size===2&&gest&&gest.pinch){const q=[...pts.values()],d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y);if(d>0){zoomAt((q[0].x+q[1].x)/2,(q[0].y+q[1].y)/2,d/gest.pinch);gest.pinch=d;cam.x-=dx/2/cam.s;cam.y-=dy/2/cam.s;userMoved();}}});
function tap(px,py){const wx=wxOf(px),wy=wyOf(py),n=pickAt(wx,wy,true);if(n===root)return;
  if(n.kind==='matrix'){const r=Math.floor((wy-n.y-30)/39);if(r>=0&&r<4&&39*cam.s>=9){setScen(r);if(focus!==n){endDemo();go(n);}return;}}
  if(n.scen!==undefined)setScen(n.scen);
  if(demo&&n!==byId[demo.steps[demo.i][0]])endDemo();go(n);}
function up(e){const had=pts.has(e.pointerId);pts.delete(e.pointerId);if(had&&gest&&!gest.pinch&&gest.moved<=6&&performance.now()-gest.t<500)tap(e.offsetX,e.offsetY);
  if(pts.size===0)gest=null;else if(pts.size===1)gest={t:0,moved:99};}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);gest=null;});
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,Math.exp(-e.deltaY*(e.ctrlKey?.012:.0016)));userMoved();},{passive:false});
cv.addEventListener('keydown',e=>{const k=e.key;if(k==='+'||k==='='){zoomAt(W/2,H/2,1.3);userMoved();}else if(k==='-'){zoomAt(W/2,H/2,1/1.3);userMoved();}
  else if(k.startsWith('Arrow')){if(demo&&(k==='ArrowRight'||k==='ArrowLeft'))stepDemo(k==='ArrowRight'?1:-1);else{const d=60/cam.s;cam.x+=k==='ArrowRight'?d:k==='ArrowLeft'?-d:0;cam.y+=k==='ArrowDown'?d:k==='ArrowUp'?-d:0;userMoved();dirty=true;}e.preventDefault();}
  else if(k==='0'){endDemo();go(root);}});
$('zIn').onclick=()=>{zoomAt(W/2,H/2,1.5);userMoved();};$('zOut').onclick=()=>{zoomAt(W/2,H/2,1/1.5);userMoved();};$('zFit').onclick=()=>{endDemo();go(root);};
$('demoBtn').onclick=()=>{if(demo){endDemo();go(root);}else startDemo();};

/* ---------- start ---------- */
readColors();build();resize();pinned=root;focus=root;fly(target(root),0);
new ResizeObserver(()=>{const was=pinned;resize();if(was)fly(target(was),0);}).observe(stage);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readColors();shown=null;});
new MutationObserver(()=>{readColors();shown=null;}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{dirty=true;});
window.__nm={go:id=>go(byId[id]),ids:()=>Object.keys(byId)};
requestAnimationFrame(frame);
})();
</script>
</body>
