<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marine Debris Network Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a one-screen app. A zoomable canvas holds the whole network drawn to scale (left to right:
   data -> tile -> backbone -> pooling -> five heads -> training). An inspector beside/below it explains
   whatever is in focus; the deeper the zoom, the more specific the focus (part -> layer -> function). */
:root{
  --bg:#f3f6f8; --paper:#ffffff; --fg:#14222c; --muted:#5a6b78; --line:#d5dee5; --soft:#e9eff3;
  --data:#51657a; --bb:#0b7d77; --pool:#7a4fd6; --vp:#d6589a; --uw:#2a78d6; --sh:#eb6834; --dr:#1b9e6f; --sa:#c98a00; --train:#c0392b;
  --why:#fbefd9; --whyc:#8a5200; --demo:#e2ebfb; --democ:#1f55b0; --on:#ffffff; --code:#0f1c26; --codefg:#dce8f0; --codec:#8aa2b3;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e161c; --paper:#16222b; --fg:#e6eef3; --muted:#9db0bd; --line:#2a3b46; --soft:#1c2a33;
  --data:#9db0c2; --bb:#4fd1c7; --pool:#b39cff; --vp:#ff8cc3; --uw:#6fb0ff; --sh:#ff9566; --dr:#5fd6a5; --sa:#f0bb4a; --train:#ff7b6b;
  --why:#372811; --whyc:#f0b04f; --demo:#1a2a47; --democ:#9cc0ff; --on:#0e161c; --code:#09121a; --codefg:#dce8f0; --codec:#7f97a8; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e161c; --paper:#16222b; --fg:#e6eef3; --muted:#9db0bd; --line:#2a3b46; --soft:#1c2a33;
  --data:#9db0c2; --bb:#4fd1c7; --pool:#b39cff; --vp:#ff8cc3; --uw:#6fb0ff; --sh:#ff9566; --dr:#5fd6a5; --sa:#f0bb4a; --train:#ff7b6b;
  --why:#372811; --whyc:#f0b04f; --demo:#1a2a47; --democ:#9cc0ff; --on:#0e161c; --code:#09121a; --codefg:#dce8f0; --codec:#7f97a8; color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,canvas:focus-visible{outline:3px solid var(--uw);outline-offset:2px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:10px 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar h1{font:800 20px/1.1 var(--display);margin:0;margin-right:auto;text-wrap:balance}
.bar h1 small{display:block;font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--bb);margin-bottom:2px}
.ctrl{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:100%}.ctrl::-webkit-scrollbar{display:none}
.seg{display:flex;flex:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:none;padding:6px 11px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--paper)}
.go{border:0;border-radius:10px;background:var(--uw);color:var(--on);padding:7px 13px;font-weight:700;font-size:13px}

@media (max-width:760px){.bar{padding-block:8px 6px}.bar h1 small{display:none}.bar h1{font-size:18px}.ctrl{order:3;flex-basis:100%}.seg button{padding:6px 9px;font-size:12.5px}.go{padding:7px 11px;font-size:12.5px}}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 11px;font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
.chips button.on{background:var(--fg);border-color:var(--fg);color:var(--paper)}

main{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.stage{position:relative;flex:1 1 52%;min-height:0;min-width:0;background:var(--bg)}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
canvas#cv:active{cursor:grabbing}
.lvl{position:absolute;top:8px;right:max(12px,env(safe-area-inset-right,0px));font:600 11.5px var(--body);color:var(--muted);background:color-mix(in srgb,var(--paper) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:3px 8px;pointer-events:none}
.lvl b{color:var(--fg)}
.zoom{position:absolute;bottom:10px;right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:6px}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font:700 18px var(--body);line-height:1}
.zoom button.fit{width:auto;padding:0 12px;font-size:13px}
.pick{position:absolute;top:8px;left:max(12px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--paper) 90%,transparent);border:1px solid var(--line);border-radius:12px;padding:4px 6px}
.pick span{font:600 11px var(--body);color:var(--muted);margin:0 2px;line-height:1.15}
.pick button{border:2px solid transparent;border-radius:9px;padding:0;background:none;display:block;line-height:0}
.pick button[aria-pressed="true"]{border-color:var(--fg)}
.pick canvas{width:38px;height:38px;border-radius:7px;display:block}
.hint{position:absolute;bottom:14px;left:max(12px,env(safe-area-inset-left,0px));font-size:12px;color:var(--muted);pointer-events:none;max-width:52%}

.insp{flex:0 0 46%;min-height:0;overflow-y:auto;background:var(--paper);border-top:1px solid var(--line);padding-block:12px 20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){
  main{flex-direction:row}
  .insp{flex:0 0 400px;border-top:0;border-left:1px solid var(--line);padding-left:20px}
}
.crumb{font:600 11.5px var(--body);color:var(--muted);letter-spacing:.02em;margin-bottom:4px}
.crumb button{border:0;background:none;padding:0;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:2px}
.insp h2{font:800 21px/1.15 var(--display);margin:0 0 6px;text-wrap:balance}
.codeline{display:block;font:12px/1.5 var(--mono);background:var(--soft);border-radius:8px;padding:6px 9px;margin:0 0 10px;overflow-x:auto;white-space:pre}
.insp h3{font:700 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 0 3px}
.insp p{margin:0 0 8px;max-width:62ch}
.insp ul{margin:0 0 8px;padding-left:19px;max-width:62ch}
.insp li{margin-bottom:3px}
.insp code{font:.88em var(--mono);background:var(--soft);padding:1px 5px;border-radius:5px}
.why{background:var(--why);border-radius:12px;padding:9px 12px;margin:8px 0}
.why h3{margin-top:0;color:var(--whyc)}
.why p:last-child,.why ul:last-child{margin-bottom:0}
.demo{background:var(--demo);border-radius:12px;padding:9px 12px;margin:0 0 12px}
.demo .row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.demo .row b{font:700 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--democ);margin-right:auto}
.demo .row button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 10px;font-weight:600;font-size:13px}
.demo .row button.nx{background:var(--uw);border-color:var(--uw);color:var(--on)}
.demo h4{font:700 16px/1.2 var(--display);margin:0 0 3px}
.demo p{margin:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0 0 8px;font-size:14px}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.strip{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.strip figure{margin:0;width:104px}
.strip canvas{width:104px;height:104px;border-radius:8px;image-rendering:pixelated;display:block;border:1px solid var(--line)}
.strip figcaption{font-size:11.5px;line-height:1.35;color:var(--muted);margin-top:3px}
canvas.plot{width:100%;max-width:300px;height:150px;display:block;margin:4px 0 2px}
.note{font-size:12.5px;color:var(--muted)}
.top{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}.top .crumb{margin:0;flex:1;min-width:0;padding-top:3px}
.nav{display:flex;gap:4px;flex:none}
.nav button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:2px 9px;font-weight:700;font-size:13px;line-height:1.5}
.nav button:disabled{opacity:.35;cursor:default}
.kids{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 10px}
.kids button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 10px;font-weight:600;font-size:12.5px}
.pnote{background:var(--demo);border-radius:10px;padding:7px 11px;margin:0 0 8px;font-size:14px}
.pnote b{color:var(--democ)}
details.src{margin:8px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
details.src summary{cursor:pointer;padding:6px 10px;font:600 12px var(--body);color:var(--muted);background:var(--soft);list-style:none}
details.src summary::-webkit-details-marker{display:none}
details.src summary::before{content:"▾ "}details.src:not([open]) summary::before{content:"▸ "}
details.src summary b{font-family:var(--mono);font-weight:600;color:var(--fg)}
details.src pre{margin:0;padding:9px 11px;font:12px/1.55 var(--mono);overflow:auto;max-height:300px;background:var(--code);color:var(--codefg);tab-size:4}
details.src pre .c{color:var(--codec);font-style:italic}
table.tb{border-collapse:collapse;font-size:13px;margin:4px 0 8px;font-variant-numeric:tabular-nums;width:100%}
table.tb th{font:700 10.5px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:3px 6px;border-bottom:1px solid var(--line)}
table.tb td{padding:4px 6px;text-align:right;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px}
table.tb th:first-child,table.tb td:first-child{text-align:left;font-family:var(--body);font-weight:600}
table.mk tr[data-scen]{cursor:pointer}table.mk tr.on td{background:var(--why)}
table.mk td.one{color:var(--fg);font-weight:700}table.mk td.zero{color:var(--muted)}
.tscroll{overflow-x:auto}
.rd{padding:8px 11px 4px;border-top:1px solid var(--line)}
.rd h4{font:700 10.5px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}
.rd ul{list-style:none;margin:0;padding:0;max-width:none}
.rd li{margin:0 0 10px;font-size:13.5px;line-height:1.45}
.rd li code{display:block;width:fit-content;max-width:100%;overflow-x:auto;white-space:nowrap;margin-bottom:3px;font:600 12px var(--mono);
  background:var(--code);color:var(--codefg);border-left:3px solid var(--uw);border-radius:6px;padding:4px 9px}
.kern{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 8px;font:12px var(--mono)}
.kern table{border-collapse:collapse}.kern td{border:1px solid var(--line);padding:3px 6px;text-align:right;min-width:40px}
.kern b{font:700 14px var(--body)}
.kern span{font:700 15px var(--mono);background:var(--soft);border-radius:6px;padding:3px 8px}
.insp ol{margin:0 0 8px;padding-left:21px;max-width:62ch}
@media (max-width:760px){.seg .lg{display:none}.seg button{padding:6px 8px}}
@media (max-width:480px){.pick span{display:none}.lvl{font-size:10.5px;padding:2px 6px}}
</style>
</head>
<body>
<header class="bar">
  <h1><small>Marine Debris Classification</small>The network, zoomable</h1>
  <div class="ctrl">
    <div class="seg" id="modelSeg" role="group" aria-label="Which model">
      <button data-m="cnn" aria-pressed="true"><span class="lg">Baseline </span>CNN</button><button data-m="mn" aria-pressed="false">MobileNet<span class="lg">V2</span></button></div>
    <div class="seg" id="phaseSeg" role="group" aria-label="Which phase">
      <button data-p="train" aria-pressed="true">Train</button><button data-p="val" aria-pressed="false">Validate</button><button data-p="test" aria-pressed="false">Test</button><button data-p="use" aria-pressed="false">Use it</button></div>
  </div>
  <button class="go" id="demoBtn">▶ Follow one tile</button>
</header>
<nav class="chips" id="chips" aria-label="Jump to a part"></nav>
<main>
  <div class="stage" id="stage">
    <canvas id="cv" tabindex="0" aria-label="Zoomable drawing of the network. Use the Jump buttons above to move between parts; the panel next to it explains the part in focus."></canvas>
    <div class="pick" id="pick" role="group" aria-label="Example tile"><span>Example<br>tile</span></div>
    <div class="lvl">Zoom: <b id="lvl">Overview</b></div>
    <div class="hint" id="hint">Pinch or scroll to zoom. Tap a part to dive in.</div>
    <div class="zoom"><button id="zOut" aria-label="Zoom out">−</button><button id="zIn" aria-label="Zoom in">+</button><button id="zFit" class="fit">Fit all</button></div>
  </div>
  <aside class="insp" id="insp" aria-live="polite"></aside>
</main>

  src:[m?'convblock':'mnv2','gpool','make_heads'],
  extra:`<p class="note">Everything is drawn to scale: a tensor’s front face is its width × height, its depth is its number of channels, and every dot in a head is one neuron. The four tiles and the scores shown for them are made up for illustration. Thresholds, results, curves and code are the project’s real ones.</p>`};},
data:()=>phase==='use'?{title:'Your photo, any size',what:`<p>In the web app there is no dataset name and no label. There is only a photo. The app has to find out the viewpoint by itself, then cut the photo the way the training data was cut.</p>`,why:`<p>The network was trained on tiles of a certain size and scale. Feeding it tiles prepared the same way keeps what it sees close to what it learned from.</p>`,src:['app_view']}
 :phase==='train'?{title:'Where a training tile comes from',what:`<p>Each dataset is one camera viewpoint. Photos were cut into tiles by <code>1_prepare_data.py</code>. Training draws tiles from all four datasets into every batch, fits each one to 320 × 320 and changes it slightly.</p>`,why:`<p>The network only ever sees tiles, never whole photos. Cutting keeps small debris big enough to see at 320 pixels.</p>`,src:['getitem']}
 :{title:`Where a ${phase==='val'?'validation':'test'} tile comes from`,what:`<p>The ${phase==='val'?'validation':'test'} tiles are a separate part of each dataset that training never touches. They are fed one after another, every tile exactly once, with no random changes.</p>`,why:`<p>A score only means something if it is measured on tiles the network did not learn from. The split keeps whole video blocks and photo groups together, so near-copies of training tiles cannot leak in.</p>`,src:['evalset']},
datasets:n=>{const S=SC[n.scen],sp=phase==='use'?'train':phase,spn=sp==='train'?'training':sp==='val'?'validation':'test';return{title:`${S.ds}: the ${S.key} dataset`,what:`<p>Every ${S.ds} tile belongs to the <b>${S.key} head</b>. That link is written once, in <code>HEAD_OF</code>, and used everywhere: to build the loss mask, to score the right head, to pick thresholds.</p><p>Tapping a dataset sends one of its tiles through. This one shows ${S.what}.</p><ul>${SC.map(s=>`<li><b>${s.ds}</b> → ${s.key}: ${cnt(sp,s)} ${spn} tiles</li>`).join('')}</ul>`,
  why:`<p>One public dataset per viewpoint. A tile’s dataset is always known in training, validation and testing, which is what lets the code say which head the tile belongs to. Only the web app does not know it.</p>`,src:['datasets'],maps:[[S.img,`made-up ${S.key} tile`]]};},
batch:()=>({title:'Balanced batch',what:`<p>Every batch of 96 tiles has a fixed number from each dataset: 26 underwater, 26 shore, 23 drone, 21 satellite. Each dataset is its own shuffled deck; a batch deals from every deck.</p><p>Inside each dataset, clean tiles are cut down to 20% of the pool (except MADOS, which is small and keeps all of its tiles).</p>`,
  why:`<p>The datasets are very different sizes. With plain random batches the biggest set would fill most of every batch and the satellite head would hardly ever get a turn. Fixed shares give every head steady practice in every batch.</p><p>This also matters for the mask: in a batch of 96, the underwater head learns from exactly 26 tiles and ignores the other 70.</p>`,plot:'batch',small:true,plotCap:'one batch of 96: underwater · shore · drone · satellite',src:['batch']}),
evalset:()=>{const sp=phase;return{title:'Every tile once, in order',what:`<p>All ${fmt(Object.values(D.counts[sp]).reduce((a,b)=>a+b,0))} ${sp==='val'?'validation':'test'} tiles go through, in the order of the manifest file, in fixed-size batches. No shuffling, no balancing, no dropping of clean tiles, no augmentation.</p>`,
  why:`<p>Training batches are engineered to teach well. ${sp==='val'?'Validation':'Test'} batches must describe the real data, so nothing is rebalanced. And with nothing random, the same model always gets the same score.</p>`,facts:SC.map(S=>[S.ds,cnt(sp,S)+' tiles']),src:['evalset']};},
photo:()=>({title:'Your photo',what:`<p>Any photo, any size: a phone picture of a beach, a frame from a diving video, a drone shot. The app does not know which.</p>`,why:`<p>This is the one place where the viewpoint head’s answer is really needed. In training, validation and testing the dataset name gives the viewpoint for free.</p>`,src:['to_input']}),
grid:()=>{const S=SC[scen];return{title:'Two passes through the same network',what:`<ol><li><b>Pass 1, whole photo.</b> The entire photo is squeezed to 320 × 320 and run through the network. Only the viewpoint head is read. For this photo it says “${S.key}”.</li><li><b>Pass 2, tiles.</b> The photo is cut the way that viewpoint’s training data was cut (${S.gridTxt}), each tile is fitted to 320 × 320, and all tiles go through together. Now only the ${S.key} head is read.</li></ol>`,
  why:`<p>A whole photo squeezed to 320 pixels is enough to tell sea floor from beach from orbit. It is not enough to see a bottle. The tiles restore the scale the debris heads were trained at.</p><p>Underwater 3 × 2, shore 3 × 3, drone about one tile per 640 pixels, satellite uncut: the same grids as <code>1_prepare_data.py</code>.</p>`,plot:'grid',small:true,src:['tile_grid','app_view']};},
resize:()=>({title:'Any size in, 320 × 320 out',what:`<p>The network accepts exactly 320 × 320 pixels. Whatever size a tile has on disk, it is stretched or shrunk to that just before it goes in.</p>
  <ul><li><b>Bigger than 320</b> (most tiles are saved at 352 × 352): shrunk with <code>INTER_AREA</code>, which averages neighbouring pixels. Detail is merged, never skipped, so thin objects fade but do not flicker in and out.</li>
  <li><b>Smaller than 320</b> (satellite patches are 240 × 240): enlarged with <code>INTER_LINEAR</code>, which blends between pixels. No new detail appears. The picture only gets bigger and softer.</li>
  <li><b>Not square:</b> squeezed into a square, so objects get a little wider or narrower. Tiles are cut close to square to keep this small.</li></ul>
  ${phase==='train'?'<p>In training a random 90–100% crop is taken first, then resized. That is the “zoom” part of augmentation, and it is why tiles are saved at 352: even the smallest crop still has about 317 real pixels a side.</p>':''}
  ${phase==='use'?'<p><b>In the app:</b> a very large photo is still cut into the same grid, so each tile is shrunk a lot and small debris can vanish. A very small photo gives tiles that are blown up: blurry, with objects looking bigger than anything in training. Both make the answer less reliable.</p>':''}`,
  why:`<p><b>Why one fixed size:</b> the tiles of a batch are stacked into one block of numbers, so they must all have the same shape. And the filters learned what debris looks like at this scale, so the same size is used in training, validation, testing and the app.</p>
  <p><b>Why 320:</b> it is a balance. At 224 (the usual MobileNetV2 size) a small bottle cap is only a few pixels. At 448 there are twice as many pixels as at 320, so twice the work and memory per tile and smaller batches. 320 keeps small debris visible and still allows batches of 96 on one GPU.</p>
  <p>Convolution filters slide, so they work at any size. That is why MobileNetV2’s ImageNet weights, learned at 224, can be reused at 320.</p>`,plot:'resize',small:true,plotCap:'dashed: a smaller and a bigger tile · solid: both become 320 × 320',
  src:phase==='train'?['crop_resize','save_size']:phase==='use'?['to_input','save_size']:['plain','save_size']}),
aug:()=>({title:'Augmentation',what:`<p>Each time a training tile is used it is changed slightly at random: a small zoom (the crop in the step before), a mirror flip, a tilt of up to 15°, a brightness and contrast change.</p>`,
  why:`<p>The network never sees exactly the same picture twice, so it has to learn the object, not memorise pixels.</p><p>Each dataset has its own settings. Only the drone set also gets 90° turns and upside-down flips: a camera looking straight down has no “up”, but an upside-down beach is not realistic. Satellite patches are not flipped here because they were already saved in 8 orientations. Validation, test and app tiles are never augmented.</p>`,src:['aug']}),
input:()=>{const S=SC[scen];return{title:'The tile: 320 × 320 × 3',what:`<p>A tile is 320 pixels wide, 320 high, with 3 colour values (red, green, blue) per pixel: <b>307,200 numbers</b> between 0 and 255. This made-up one shows ${S.what}.</p>`,
  why:`<p>320 is big enough for small debris to stay visible and small enough to train batches of 96 on one GPU. The “Fit to 320” step before this explains what happens to tiles of other sizes.</p>`,maps:[[S.img,`The made-up ${S.key} tile`]],src:['input']};},
rescale:()=>({title:'Rescale to −1…+1',what:`<p>Every number is divided by 127.5 and 1 is subtracted: 0 becomes −1, 255 becomes +1. The picture does not change, only the size of the numbers.</p><p>This layer is inside the model, so it happens the same way in every phase and in the app.</p>`,
  why:`<p>Weights start as small numbers around zero. Inputs that are also small and centred on zero train faster and more steadily than inputs up to 255.</p><p>It is also exactly the range MobileNetV2 was trained with, so both models receive identical input.</p>`,plot:'rescale',plotCap:'pixel value 0…255 → network input −1…+1',src:['input']}),
bb:()=>({title:'Backbone: four blocks that find features',what:`<p>Each block does the same four steps: convolution, BatchNorm, LeakyReLU, max pooling. After every block the picture is <b>half as wide and high</b> and has <b>twice as many channels</b>: 320 → 160 → 80 → 40 → 20 pixels, 3 → 32 → 64 → 128 → 256 channels.</p><p>You can see it in the shapes: the slabs get smaller in front and longer in depth.</p>`,
  why:`<p><b>Why halve and double:</b> early on, <i>where</i> things are matters and there are only a few simple patterns (edges). Deeper in, exact position matters less and there are many more kinds of pattern to tell apart, so space is traded for channels.</p><p><b>Why four blocks:</b> after four poolings each cell of the final 20 × 20 grid has looked at a 46 × 46 pixel patch of the tile, about the size of a piece of debris in a tile.</p><p><b>Why this small:</b> it is the baseline trained from scratch. With about 123,000 training tiles, a small network is less likely to memorise them.</p>`,
  facts:[['Conv weights','387,936'],['BatchNorm values','1,920'],['Output','20 × 20 × 256']],src:['convblock']}),
block:n=>{const F=[3,32,64,128,256],k=n.k,a=320>>(k-1),b=320>>k;return{title:`Block ${k}`,what:`<p>${BLOCKNOTE[k]}</p><p>Shape in: ${a} × ${a} × ${F[k-1]}. Shape out: ${b} × ${b} × ${F[k]}.</p>`,
  why:`<p>The four steps always come in this order: the filters compute, BatchNorm tidies the scale, LeakyReLU decides what passes, and pooling shrinks the map.</p>`,
  facts:[['Filters',String(F[k])],['Conv weights',`3 × 3 × ${F[k-1]} × ${F[k]} = ${fmt(9*F[k-1]*F[k])}`],['Numbers out',fmt(b*b*F[k])]],maps:ST()[k].out.slice(0,4).map((m,i)=>[mapCanvas(m,b),`map ${i+1} of ${F[k]}`]),mapNote:'Made-up maps from hand-written filters, to show the idea.',src:['convblock']};},
conv:n=>{const F=[3,32,64,128,256],k=n.k,s=ST()[k],r=range(s.conv[0]);return{title:`Convolution 3 × 3 · ${F[k]} filters`,
  what:`<p>A filter is a small 3 × 3 window of weights. It slides over the picture; at each position it multiplies the 3 × 3 patch under it (across all ${F[k-1]} input channels) by its weights and adds everything up. The result is one number: “how strongly does my pattern appear here?”</p><p>${F[k]} filters give ${F[k]} such maps.</p>`,
  why:`<p><b>3 × 3</b> is the smallest window that sees a neighbour in every direction. Stacking small windows over several blocks covers a large area with far fewer weights than one big window.</p><p><b><code>padding="same"</code></b> keeps the map the same size, so only pooling changes the size.</p><p><b><code>use_bias=False</code></b>: the BatchNorm that follows already adds its own shift (β), so a bias here would be a second shift doing nothing.</p>`,
  facts:[['Weights',fmt(9*F[k-1]*F[k])],['Each filter',`3 × 3 × ${F[k-1]} = ${9*F[k-1]} weights`]],
  maps:[[k===1?SC[scen].img:mapCanvas(ST()[k-1].out[0],s.n),'going in'],[mapCanvas(s.conv[0],s.n),`after a made-up edge filter (values ${r[0].toFixed(1)} … ${r[1].toFixed(1)})`]],after:k===1?convExample():'',src:['convblock']};},
bn:n=>{const s=ST()[n.k],r=range(s.conv[0]),q=range(s.bn[0]),ms=stats(s.conv[0]);return{title:'Batch normalisation',pnote:offNote(BNOFF),
  what:`<p>For each channel: subtract the average, divide by the spread. Now the channel is centred on 0 with a spread of 1. Then multiply by γ and add β, two values the network learns for each channel.</p><p>For this map: average ${ms[0].toFixed(2)}, spread ${ms[1].toFixed(2)} before; 0 and 1 after.</p>`,
  why:`<p>Without it, the size of the numbers drifts from layer to layer and changes as the weights change, which makes training slow and very sensitive to the learning rate. BatchNorm keeps every layer’s input in a steady range.</p><p>γ and β let the network choose a different scale and centre if that works better. They are left out of weight decay: shrinking γ toward zero would slowly switch a channel off.</p>`,
  maps:[[mapCanvas(s.conv[0],s.n),`before: ${r[0].toFixed(1)} … ${r[1].toFixed(1)}`],[mapCanvas(s.bn[0],s.n),`after: ${q[0].toFixed(1)} … ${q[1].toFixed(1)}, average 0`]],mapNote:'The picture looks the same: BatchNorm only moves and stretches the numbers.',plot:'bn',plotCap:'grey: values before · colour: centred on 0 after',src:['convblock']};},
lrelu:n=>{const s=ST()[n.k],q=range(s.bn[0]);return{title:'LeakyReLU',
  what:`<p>Positive numbers pass unchanged. Negative numbers are multiplied by 0.1, so −5 becomes −0.5.</p><p>This bend is what lets the network learn anything beyond straight-line relationships: without an activation, four blocks would collapse into one big multiplication.</p>`,
  why:`<p><b>Why not plain ReLU:</b> ReLU turns every negative into exactly 0. A neuron that keeps getting negative input then outputs 0 and gets zero gradient, so it can never recover (a “dead” neuron). The small slope keeps a little signal and a little gradient flowing.</p><p><b>Why not SELU here:</b> the conv blocks already have BatchNorm to keep the scale steady, so a cheap, simple activation is enough.</p>`,
  maps:[[mapCanvas(s.bn[0],s.n,q[0],q[1]),'before'],[mapCanvas(s.act[0],s.n,q[0],q[1]),'after: the dark (negative) areas are lifted toward zero']],plot:'lrelu',plotCap:'input → output: the left side keeps a slope of 0.1',src:['convblock']};},
pool:n=>{const s=ST()[n.k];return{title:'Max pooling 2 × 2',
  what:`<p>The map is cut into 2 × 2 squares and only the largest number in each square is kept. Width and height halve: ${s.n} → ${s.n>>1}.</p>`,
  why:`<p><b>Why shrink:</b> a quarter of the numbers means a quarter of the work for the next block, and each later filter sees twice as much of the tile.</p><p><b>Why the maximum and not the average:</b> a filter fires strongly where its pattern is. Keeping the maximum answers “was the pattern anywhere in this square?”. Averaging would dilute one strong response with three weak ones, and small debris is exactly that kind of signal.</p><p>It also makes the network care less about a one-pixel shift.</p>`,
  maps:[[mapCanvas(s.act[0],s.n),`${s.n} × ${s.n}`],[mapCanvas(s.out[0],s.n>>1),`${s.n>>1} × ${s.n>>1}: same picture, coarser`]],after:poolExample(n.k),plot:'pool',small:true,src:['convblock']};},
tensor:n=>{const F=[3,32,64,128,256],k=n.k,b=320>>k;return{title:`Feature maps: ${b} × ${b} × ${F[k]}`,what:`<p>The output of block ${k}: ${F[k]} maps, each ${b} × ${b}. Each map belongs to one filter and is bright where that filter’s pattern was found.</p><p>The slab is drawn to scale: its front is ${b} × ${b}, its depth is ${F[k]} channels.</p>`,
  why:`<p>${k<4?'This is what the next block reads. It no longer sees pixels, only “where was each pattern found”.':'This is the backbone’s final answer: for each of 400 positions, how strongly each of 256 patterns is present. Global pooling turns it into one list next.'}</p>`,
  facts:[['Numbers',fmt(b*b*F[k])],['Each cell has seen',['','4 × 4','10 × 10','22 × 22','46 × 46'][k]+' pixels of the tile']],maps:ST()[k].out.slice(0,6).map((m,i)=>[mapCanvas(m,b),`map ${i+1}`]),mapNote:`6 of ${F[k]} maps. Made up with hand-written filters, not the trained weights.`};},
mnv2:()=>({title:'MobileNetV2 backbone',what:`<p>Instead of our four blocks, the backbone is MobileNetV2 with the weights it learned on ImageNet (about 1.3 million everyday photos). Its 1,000-class classifier is removed; only the feature extractor is kept. It turns the tile into 10 × 10 × 1,280.</p>`,
  why:`<p><b>Why transfer learning:</b> a network that has already learned edges, textures and shapes from over a million photos does not have to learn them again from our tiles.</p><p><b>Why MobileNetV2:</b> it is a light network (2.26 million backbone weights), it ships with Keras with ImageNet weights, and it is a standard choice for transfer learning.</p><p><b>Why the same heads:</b> everything after the backbone is identical to the CNN, so any difference in the scores comes from the backbone alone.</p>`,
  facts:[['Backbone weights','2,257,984'],['Output','10 × 10 × 1,280'],['Pooled','2,560 numbers'],['Whole model','6,177,459']],src:['mnv2']}),
frozen:()=>({title:'Frozen part: stem to block 12',what:`<p>These layers take the tile down to 20 × 20 × 96. We never change their weights, in either training stage.</p>`,why:`<p>Early layers detect general things (edges, colours, simple textures) that are useful for any photo, including ours. Retraining them on a small dataset could only damage them.</p>`,src:['mnv2']}),
tuned:()=>({title:'Fine-tuned part: block 13 to the end',what:`<p>The last layers: 20 × 20 × 96 → 10 × 10 × 1,280. In stage 1 they are frozen like the rest. In stage 2 they are unfrozen and trained with a learning rate 100 times smaller (1e-5).</p>`,
  why:`<p><b>Why these layers:</b> the last layers hold the most ImageNet-specific patterns (dog faces, car wheels). They are the ones worth adapting to debris.</p><p><b>Why only after stage 1:</b> at the start the heads are random and send back large, meaningless corrections. If the backbone could move then, those corrections would wreck its features.</p><p><b>Why 1e-5:</b> an earlier run used 1e-4 and viewpoint accuracy fell from 99% to 68% in the first fine-tuning epoch.</p><p><b>BatchNorm stays frozen</b> (<code>training=False</code>): its statistics come from ImageNet; re-estimating them on our small mixed batches would distort every feature.</p>`,src:['unfreeze']}),
invres:()=>({title:'Inverted residual block',what:`<p>MobileNetV2’s building block, in three steps: a 1 × 1 convolution widens the channels, a 3 × 3 <i>depthwise</i> convolution filters each channel separately, and a 1 × 1 convolution narrows them again. A shortcut adds the block’s input to its output when the shapes match. Its activation is ReLU6 (ReLU capped at 6).</p>`,why:`<p>Filtering each channel separately costs far fewer weights than a full 3 × 3 convolution, which is how the network stays small. We did not design this part; it comes as it was published.</p>`,plot:'invres',small:true}),
mtensor:n=>({title:`Feature maps: ${n.s} × ${n.s} × ${fmt(n.d)}`,what:`<p>An intermediate result inside MobileNetV2, drawn to scale: the front is ${n.s} × ${n.s}, the depth is ${fmt(n.d)} channels.</p>`,why:`<p>The same trend as in our CNN, pushed further: the picture ends at 10 × 10, but with 1,280 channels.</p>`,facts:[['Numbers',fmt(n.s*n.s*n.d)]],maps:[[SC[scen].FACE[n.face],'one made-up map']]}),
gpool:()=>{const m=mode==='cnn';return{title:'Global pooling: where the backbone meets the heads',what:`<p>The backbone ends with ${m?'256 maps of 20 × 20':'1,280 maps of 10 × 10'}. Each map is squeezed into two numbers: its <b>average</b> and its <b>maximum</b>. That gives ${m?'256 + 256 = 512':'1,280 + 1,280 = 2,560'} numbers, the only thing the heads ever see.</p>`,
  why:`<p>Dense layers need a fixed-length list, not a grid. Pooling over the whole map also throws position away on purpose: a bottle is a bottle wherever it lies in the tile.</p><p>The alternative, flattening the grid, would give ${m?'102,400':'128,000'} inputs and make the first layer of every head enormous.</p>`,src:['gpool']};},
gap:()=>({title:'Global average pooling',what:`<p>One number per map: the average of all its cells. It answers “how much of this pattern is in the tile overall?”</p>`,why:`<p>Good for things that fill the tile, like a net or a sandy texture. On its own it would wash out one small bright spot among ${mode==='cnn'?400:100} cells, which is why the maximum is taken as well.</p>`,plot:'gap',small:true,src:['gpool']}),
gmp:()=>({title:'Global max pooling',what:`<p>One number per map: its single largest cell. It answers “is this pattern strongly present anywhere?”</p>`,why:`<p>Small debris is one strong response in a small area. The maximum keeps it at full strength however much empty water surrounds it.</p>`,plot:'gmp',small:true,src:['gpool']}),
vec:n=>({title:`${fmt(n.count)} numbers: the tile’s summary`,what:`<p>Every dot is one number. The top half are the averages, the bottom half the maximums. This list is everything the heads know about the tile.</p>`,why:`<p>Joining both lists lets each head decide for itself which kind of evidence matters for each class.</p>`,src:['gpool']}),
pbn:()=>({title:'BatchNorm on the pooled numbers',pnote:offNote(BNOFF),what:`<p>The same operation as inside the blocks, applied to each of the ${mode==='cnn'?'512':'2,560'} numbers.</p>`,why:`<p>Averages are small and maximums are large, so the two halves arrive on different scales. BatchNorm puts all of them on one scale: centred on 0 with a spread of 1.</p><p>That is also exactly the input the SELU layers in the heads expect to stay self-normalising.</p>`,plot:'bn',src:['gpool']}),
heads:()=>{const S=SC[scen];return{title:'Five heads read the same numbers',what:`<p>The pooled list fans out to five small dense networks. Each is fully connected to all ${mode==='cnn'?'512':'2,560'} numbers and answers one question: which viewpoint, or which debris classes for one viewpoint.</p><p><b>All five always compute.</b> For this ${S.ds} tile, only the viewpoint head and the ${S.key} head matter; the other three produce numbers that are ${phase==='train'?'given weight 0 by the loss mask':phase==='use'?'never read':'not scored'}.</p>`,
  why:`<p><b>Why separate heads:</b> each dataset has its own class list (16, 13, 7 and 7 classes). One shared list would mix classes that were never labelled together.</p><p><b>Why different sizes:</b> a head is sized by how many training labels it has to learn from. More data can support more neurons without memorising. The rule: first layer = 512 × √(labels ÷ shore’s 28,123), rounded to a multiple of 64, at least 128; each next layer is half.</p>`,
  facts:HEADS.map(h=>[h.id,`${h.units.join(' → ')} → ${CLASSES[h.id].length}`]),src:['headcfg','make_heads']};},
head:n=>{const h=n.head,no=CLASSES[h.id].length,S=SC[scen],on=isOn(h);let p=0,a=mode==='cnn'?512:2560;for(const u of h.units){p+=a*u+u;a=u;}p+=a*no+no+(h.trash?a+1:0);
  const st=h.id==='viewpoint'?'It is used for every tile, from every dataset.':on?`This ${S.ds} tile belongs to it, so this is the head that ${phase==='train'?'learns from the tile':phase==='use'?'is read':'is scored'}.`:`This tile is from ${S.ds}, not this head’s dataset. It still computes, but its answer is ${phase==='train'?'multiplied by 0 in the loss':phase==='use'?'never read':'not scored'}.`;
  return{title:`${h.id[0].toUpperCase()+h.id.slice(1)} head`,what:`<p>${h.units.map(u=>`Dense ${u}`).join(' → ')} → ${no} ${h.id==='viewpoint'?'softmax':'sigmoid'} outputs${h.trash?' plus one trash neuron':''}. Every hidden layer is followed by SELU and AlphaDropout(${h.drop}).</p><p>${st}</p>`,
  why:`<p>${HEADNOTE[h.id]}</p>${h.units.length>1?'<p>Each layer is half the one before: a funnel that squeezes the summary toward the few answers this head has to give.</p>':''}`,
  facts:[['Weights',fmt(p)],...(h.labels?[['Training labels',h.labels]]:[]),['Dropout',String(h.drop)]],src:['headcfg','head']};},
dense:n=>({title:`Dense layer: ${n.units} neurons`,
  what:`<p>Each of the ${n.units} dots is a neuron. A neuron multiplies every one of its ${fmt(n.inp)} inputs by its own weight, adds them up, adds a bias, and passes the result through SELU.</p><p>The shaded band on its left is all of those connections at once.</p>`,
  why:`<p><b>Dense</b> (every input connected to every neuron) because after pooling there is no picture left, only a list where any number might matter for any class.</p><p><b><code>lecun_normal</code></b> sets the size of the starting weights so that SELU’s self-normalising works from the first step.</p>`,
  facts:[['Weights',`${fmt(n.inp)} × ${n.units} + ${n.units} = ${fmt(n.inp*n.units+n.units)}`]],plot:'neuron',small:true,plotCap:'one neuron: many inputs, one weighted sum, one output',src:['head']}),
selu:()=>({title:'SELU activation',what:`<p>Positive inputs are multiplied by about 1.05. Negative inputs follow a curve that flattens out at about −1.76.</p>`,
  why:`<p>SELU is <b>self-normalising</b>: with the right starting weights, each layer’s outputs settle around an average of 0 and a spread of 1 by themselves. So the heads stay stable without a BatchNorm after every dense layer.</p><p>The backbone uses LeakyReLU because it has BatchNorm doing that job; the heads have none, so they use SELU.</p>`,plot:'selu',plotCap:'input → output: 1.05·x when positive; a curve down to −1.76 when negative',src:['head']}),
adrop:n=>({title:`AlphaDropout ${n.head.drop}`,pnote:offNote('dropout is switched off. Every neuron is used, so the same tile always gives the same scores.'),what:`<p>During training, a random ${Math.round(n.head.drop*100)}% of this layer’s neurons are knocked out on each step. At validation, test and in the app nothing is dropped.</p>`,
  why:`<p><b>Why drop neurons:</b> the head cannot rely on any single neuron, so it has to spread what it knows. That reduces memorising of the training tiles.</p><p><b>Why the “alpha” version:</b> ordinary dropout sets neurons to 0, which shifts the average and breaks SELU’s self-normalising. AlphaDropout sets them to SELU’s negative floor and rescales, so the average and spread stay where SELU needs them.</p><p><b>Why ${n.head.drop}:</b> 0.2 for the two heads that overfit (underwater, satellite), 0.1 for the others.</p>`,plot:'drop',small:true,src:['head']}),
out:n=>{const h=n.head,no=CLASSES[h.id].length,S=SC[scen],Pr=probs(),on=isOn(h);
  if(h.id==='viewpoint')return{title:'4 softmax outputs',
   what:`<p>Four scores that always add up to 1: underwater, shore, drone, satellite. For this made-up tile: ${S.key} ${Pr.vp[scen].toFixed(2)}.</p>${phase==='train'?`<p><b>In training</b> the correct answer is known from the dataset: “${S.key}” should be 1, the rest 0. The viewpoint head learns from every tile.</p>`:phase==='use'?'<p><b>In the app</b> this answer is the only way to know the viewpoint. The highest score picks the tile grid and the head to read.</p>':'<p><b>Here</b> the highest score is compared with the tile’s real dataset to count how often the viewpoint is right. It is not used to choose a head: the dataset name does that.</p>'}`,
   why:`<p>A tile comes from exactly one camera, so the four answers compete. Softmax makes raising one score lower the others.</p><p><code>dtype="float32"</code>: the rest of the network runs in 16-bit numbers for speed, but final probabilities are computed in 32-bit so they stay precise.</p>`,facts:[['Weights',`${n.inp} × 4 + 4 = ${fmt(n.inp*4+4)}`]],src:['head']};
  const f=foundList();return{title:`${no} sigmoid outputs`,
  what:`<p>One output per class, each its own yes/no between 0 and 1. They do not add up to 1.</p>${on?(phase==='train'?`<p><b>In training</b> each output has a target taken from the tile’s labels: 1 for ${S.present.join(', ')}; 0 for every other class. The loss measures how far the scores are from those targets.</p>`:`<p><b>${phase==='val'?'During the epochs these scores are only ranked (AUC). After training,':'Here'}</b> each score is compared with its class’s own threshold, the tick on each bar. For this tile that gives: ${f.map(x=>x[0]).join(', ')||'nothing'}.</p>`):`<p>This tile is from ${S.ds}, so these numbers are ${phase==='train'?'ignored by the loss':phase==='use'?'never read':'not scored'}.</p>`}`,
  why:`<p>A tile can hold several kinds of debris at once, or none. With softmax, a bottle and a rope would have to share one probability. With sigmoids each class is judged alone.</p><p>Scores from focal loss are small by nature, so the “yes” line is not 0.5. Each class gets its own threshold, tuned on the validation set.</p>`,
  facts:[['Weights',`${n.inp} × ${no} + ${no} = ${fmt(n.inp*no+no)}`]],after:phase!=='train'?thrTable(h):'',plot:'sigmoid',plotCap:'any number in → a value between 0 and 1 out',src:['head']};},
trash:n=>({title:'The trash neuron',what:`<p>One extra output on the same last hidden layer as the class outputs. It answers a simpler question: is there <i>any</i> trash in this tile?</p>${phase==='train'?'<p><b>In training</b> its target is 1 if the tile has at least one trash class, else 0. It uses the same mask as its head.</p>':phase==='use'?'<p><b>In the app</b> the photo’s trash probability is the highest trash-neuron score among its tiles, and “trash found” means that score is at least 0.5.</p>':''}`,
  why:`<p><b>Why add it:</b> combining many uncertain class scores into one trash score works less well than training one neuron directly on that question.</p><p><b>Why one neuron, not two:</b> with “trash” and “no trash” outputs, the second is always 1 minus the first. One sigmoid gives the same information.</p>${n.head.id==='satellite'?'<p>For satellite only some classes count as trash (see <code>TRASH_CLASSES</code> below); ships, algae and foam do not.</p>':''}`,
  facts:[['Weights',`${n.inp} + 1 = ${n.inp+1}`],['Test AUC, this head',pct(D.neuron[mode][n.head.id][4])+'%']],src:['trashcfg','head']}),
tail:()=>({train:{title:'Training: how the weights learn',what:`<p>Everything to the right of the outputs here exists only during training. The outputs are compared with the correct answers to give a loss (one number saying how wrong the network was). The loss is sent backwards through the network, and the optimizer changes every weight a little to make it smaller.</p><p>Order: loss mask → one loss per output → total loss → AdamW → corrections flow back.</p>`,why:`<p>Each choice here answers a problem we met: four datasets with different classes (the mask), rare classes (focal loss), heads with very different amounts of data (AdamW), one head that overfits (the lever).</p>`,src:['getitem','losses']},
 val:{title:'Validation: scoring, never learning',what:`<p>After every training epoch, all validation tiles are run through the network once. Dropout is off and no weight is changed. For each debris head an AUC is computed on its own tiles; the four are averaged into <code>val_trash_auc</code>.</p><p>That one number then drives three decisions: save the model if it is the best so far, halve the learning rate if it stalls, stop if it stalls for longer. The satellite lever watches satellite’s AUC alone.</p><p>After training, the same validation tiles are used once more to tune the thresholds.</p>`,why:`<p>The training loss always goes down, even when the network is only memorising. Validation tiles were never trained on, so their score says whether the network is really getting better at new pictures.</p>`,src:['trashauc','ckpt']},
 test:{title:'Testing: the final scores',what:`<p>Done once, after everything is decided. Every test tile goes through the best saved model. Each head is scored only on its own dataset’s tiles. Scores become yes/no using the thresholds tuned on validation, and the yes/no answers are compared with the labels.</p><p>Order: own head only → thresholds → yes or no → metrics → results table.</p>`,why:`<p>Validation was used to choose the best epoch and the thresholds, so its score is slightly flattering. The test set was used for nothing, so its score is the fair one to report.</p>`,src:['thr_loop','test_loop']},
 use:{title:'Using it: the web app',what:`<p>A photo comes in with no dataset name. The whole photo goes through once to get the viewpoint. That answer picks the tile grid and the head to read. The tiles go through, thresholds turn scores into classes, and the trash neuron gives the verdict.</p>`,why:`<p>The app repeats what evaluation did (same tiling, same head choice, same thresholds), so its behaviour matches the measured scores as closely as possible.</p>`,src:['app_view','app_photo']}}[phase]),
mask:n=>{const S=SC[scen],h=n.kind==='gate'?n.head:null,o=SC[(scen+1)%4];return{title:h?`Mask for the ${h.id} head: ${isOn(h)?'1':'0'}`:'The loss mask',
  what:`<p>Four datasets share one network, but a ${S.ds} tile only has ${S.key} labels. So before any loss is computed, <b>every head gets a weight for every tile</b>:</p><ul><li><b>1</b> for the head of the tile’s own dataset (and its trash neuron).</li><li><b>0</b> for the three other debris heads.</li><li><b>1</b> for the viewpoint head, always.</li></ul>${maskTable()}
  <p><b>How the code knows the head:</b> it does not ask the network. The tile’s row in the manifest says <code>source = "${S.src}"</code>, and <code>HEAD_OF</code> turns that into “${S.key}”. The viewpoint head’s own answer is <i>not</i> used for this.</p>
  <p><b>What the viewpoint head does in training:</b> it learns. Its target is the same dataset name (“${S.key}” = 1, the rest 0), and it gets a weight of 1 for every tile from every dataset. It is the only head that learns from all of them.</p>
  <p><b>What weight 0 does:</b> each head’s loss for a tile is multiplied by its weight. Loss × 0 = 0, so the correction is 0 as well. The masked heads’ weights do not move, and they do not push on the backbone either.</p>
  <p><b>This tile, step by step:</b></p><ol><li>All five heads compute their outputs.</li><li>Viewpoint: compared with “${S.key}”, weight 1.</li><li>${S.key[0].toUpperCase()+S.key.slice(1)}: compared with the tile’s labels (${S.present.join(', ')} = 1), weight 1.</li><li>${SC.filter(s=>s!==S).map(s=>s.key).join(', ')}: targets are all zeros, but weight 0, so nothing is learned from them.</li><li>The backbone is corrected by the two heads with weight 1.</li></ol>`,
  why:`<p>Nobody labelled this ${S.ds} tile with ${o.key} classes. Without the mask, the ${o.key} head’s target for it would be “all zeros”, and it would wrongly learn to say no to anything that looks like this tile.</p><p>In a batch of 96 (26 · 26 · 23 · 21), the underwater head learns from 26 tiles and ignores 70. The backbone and the viewpoint head learn from all 96.</p><p>A head frozen by the satellite lever gets weight 0 for <i>every</i> tile, including its own.</p>`,src:['mask','getitem']};},
maskval:()=>{const S=SC[scen];return{title:'The same mask, now for the scores',what:`<p>Validation tiles come with the same weights as training tiles: 1 for the tile’s own head, 0 for the others, 1 for viewpoint. <code>EvalSet</code> calls the same <code>make_targets()</code>.</p>${maskTable()}<p>Here the weights do not steer learning (there is none). They steer <b>counting</b>: the metrics are weighted, so the ${S.key} head’s AUC is computed only on ${S.ds} tiles.</p><p>The head is again chosen from the dataset name, not from the viewpoint head’s answer.</p>`,
  why:`<p>Scoring the shore head on underwater tiles would be meaningless: there are no shore labels for them. The mask keeps each head’s score about its own job.</p>`,src:['evalset','mask']};},
masktest:()=>{const S=SC[scen];return{title:'Own head only',what:`<p>The evaluation notebook does the same thing by hand. <code>head_data()</code> keeps only the tiles whose dataset belongs to the head, and takes that head’s scores for exactly those tiles.</p>${maskTable()}<p>So this ${S.ds} tile is counted in the ${S.key} head’s results and nowhere else. The viewpoint head is scored on every tile.</p><p><b>The order of choices in testing:</b></p><ol><li>The tile’s dataset is read from the manifest.</li><li>That names the head. (The viewpoint head’s answer is checked for accuracy, but not used to choose.)</li><li>The head’s scores are compared with its thresholds.</li><li>The yes/no answers are compared with the labels.</li></ol>`,
  why:`<p>This measures each head on the job it was trained for, with the right head guaranteed. The web app has no such guarantee, which is why viewpoint accuracy (99.5%) is reported separately.</p>`,src:['head_data']};},
chooser:()=>{const S=SC[scen];return{title:'The viewpoint head picks',what:`<p>In the app nobody says which dataset the photo is from. So the choice that the manifest made everywhere else is now made by the network itself:</p><ol><li>The whole photo goes through. The viewpoint head gives four scores.</li><li>The highest one wins (<code>argmax</code>). Here: “${S.key}”.</li><li>That sets the tile grid (${S.gridTxt}) and which debris head is read.</li><li>The other three heads still compute, but their outputs are never looked at.</li></ol>${maskTable()}<p>The app also has a dropdown to set the viewpoint by hand, for photos that look nothing like the training data.</p>`,
  why:`<p>Reading the wrong head gives a meaningless answer: the shore head never learned from underwater photos. So everything depends on this first step being right, which it was for 99.5% of test tiles.</p>`,src:['app_view']};},
focal:()=>({title:'Focal loss (class outputs)',what:`<p>Ordinary cross-entropy, multiplied by (1 − p)², where p is the probability the network gave to the correct answer. If the network is already confident and right (p near 1), the loss is almost zero.</p><p><code>alpha=0.25</code> with class balancing also weighs the (rare) “present” answers differently from the (common) “absent” ones.</p>`,
  why:`<p>Most classes are absent from most tiles, so most answers are an easy “no”. With ordinary cross-entropy, thousands of easy answers add up and drown out the few hard, rare positives. Focal loss shrinks the easy ones so training attention goes to the hard ones.</p><p>A side effect: scores stay small, which is why the yes/no thresholds end up well below 0.5.</p>`,plot:'focal',plotCap:'grey: cross-entropy · colour: focal. Horizontal: probability given to the right answer',src:['losses']}),
cce:()=>({title:'Categorical cross-entropy (viewpoint)',what:`<p>The loss is −log of the probability given to the correct viewpoint. 0.97 gives a tiny loss; 0.10 a large one.</p>`,why:`<p>The standard loss for “exactly one right answer out of several”. It counts half (weight 0.5) because viewpoint is easy; at full weight it would dominate the total without teaching the backbone anything useful about debris.</p>`,src:['losses']}),
bce:()=>({title:'Binary cross-entropy (trash neuron)',what:`<p>The plain yes/no loss: −log of the probability given to the correct answer.</p>`,why:`<p>A single yes/no question does not have the many-easy-negatives problem of the class outputs, so the focal correction is not needed. It counts half because the trash neuron is a helper next to the class outputs.</p>`,src:['losses']}),
total:()=>{const S=SC[scen];return{title:'Total loss',what:`<p>All nine losses are multiplied by their loss weights and their mask, then added into one number.</p><p>For this ${S.ds} tile: 0.5 × viewpoint loss + 1.0 × ${S.key} focal loss + 0.5 × ${S.key} trash loss. The other six terms are multiplied by 0.</p>`,why:`<p>The network has one set of shared backbone weights, so it needs one combined goal. The weights say what matters most: the class heads count fully, the easy viewpoint task and the helper trash neurons count half.</p>`,src:['losses']};},
adamw:()=>({title:'AdamW optimizer',what:`<p>Backpropagation works out, for every weight, which way to change it to lower the loss. AdamW then makes the change. The backbone’s weights receive corrections from all the heads that were not masked; a masked head sends none.</p>`,
  why:`<p><b>Adam</b> gives every weight its own step size, based on how its recent corrections looked. That suits this network: the shore head gets plenty of signal, the satellite head very little.</p><p><b>The W</b> is weight decay: each step also pulls every weight slightly toward zero, which discourages memorising. AdamW applies this separately from the step size, so it works as intended; plain Adam blends the two.</p><p>Biases and BatchNorm’s γ and β are left out of the decay.</p>`,plot:'adamw',small:true,src:['adamw']}),
sched:()=>mode==='cnn'?{title:'Training schedule',what:`<ul><li>3 warm-up epochs with batches of 32, then batches of 96, up to 60 epochs of 450 steps.</li><li>The learning rate halves after 4 epochs without improvement.</li><li>Training stops after 8 epochs without improvement.</li><li>Maths runs in 16-bit (<code>mixed_float16</code>).</li></ul>`,
  why:`<p><b>Small batches first:</b> their noisier steps help a randomly started network move out of a poor start. Bigger batches later give steadier, more precise steps.</p><p><b>Halving the rate:</b> large steps find the right area; smaller steps settle into it.</p><p><b>16-bit maths:</b> about twice as fast and half the memory on the GPU; outputs and losses stay 32-bit.</p>`,src:['sched']}
 :{title:'Two-stage schedule',what:`<ul><li><b>Stage 1:</b> backbone frozen, only the heads learn, up to 10 epochs (stops after 3 without improvement).</li><li><b>Stage 2:</b> block 13 onward unfrozen, learning rate 100 times smaller, up to 50 more epochs.</li></ul><p>The satellite lever is reset between the stages: head weights frozen for the old backbone would not fit the changing one.</p>`,why:`<p>The heads start random. Stage 1 lets them catch up on fixed features. Only then is it safe to adjust the pretrained layers, and only gently.</p>`,src:['sched_mn']},
lever:()=>{const L=D.log[mode],m=mode==='cnn';return{title:'The satellite lever',
  what:`<p>A watcher that looks at one number after every epoch: the satellite head’s validation AUC. It works in four steps:</p><ol><li><b>New best?</b> Remember the value and keep a copy of the satellite head’s weights.</li><li><b>No improvement?</b> Count one. Any new best resets the count to zero.</li><li><b>Count reaches 8?</b> Pull the lever: put the saved best weights back, and add “satellite” to <code>frozen_heads</code>.</li><li><b>From then on:</b> the loss mask gives satellite weight 0 for every tile (so no correction, and no pull on the backbone), and its weights are held at the saved copy.</li></ol>
  <p><b>What happened in the real run</b> (curve below, from the training log): the satellite AUC peaked at epoch ${L.bestSat}${m?'':` (stage 2 began after epoch ${L.stage2})`}, did not beat that for 8 epochs, and the head was frozen after epoch ${L.frozenAfter}. From then on its training loss in the log is exactly 0: the mask at work.</p><p>The curve keeps moving a little after the freeze. The head is fixed, but the shared backbone under it still changes with the other heads.</p>`,
  why:`<p><b>Why satellite needs it:</b> only 1,053 unique patches. It reaches its best long before the other heads and then only memorises (0.94 on training against 0.85 on validation in an earlier run). The other heads still need many more epochs.</p><p><b>Why not stop the whole training:</b> the other three heads were still improving.</p><p><b>Why not <code>trainable=False</code>:</b> the optimizer is built for a fixed set of weights. Changing that set in the middle of <code>fit()</code> breaks it. Masking the loss and pinning the weights has the same effect without touching the optimizer.</p>${m?'':'<p><b>MobileNetV2:</b> the lever starts fresh in stage 2, because head weights pinned for the old backbone dragged satellite down in an earlier run.</p>'}`,
  plot:'lever',plotCap:`Satellite validation AUC per epoch, real log (${m?'cnn_adamw_v3':'mnv2_adamw_v2'}). Shaded: the 8 epochs with no new best.`,facts:[['Best epoch',String(L.bestSat)],['Patience','8 epochs'],['Frozen after epoch',String(L.frozenAfter)]],src:['lever']};},
ckpt:()=>{const L=D.log[mode];return{title:'Checkpoint',what:`<p>After every epoch the model is scored on the validation set. It is saved only when <code>val_trash_auc</code> reaches a new best, overwriting the previous file.</p><p>In the real run the best was ${L.bestVal.toFixed(4)} at epoch ${L.bestEp}${mode==='cnn'?`; the continued run later reached ${L.longBestVal.toFixed(4)} at epoch ${L.longBestEp}, which became the final CNN`:''}.</p>`,why:`<p>The last epoch is rarely the best one. The saved file is always the best epoch seen, and it is chosen on debris quality, not on the total loss, which the easy viewpoint task would dominate.</p>`,plot:'vta',plotCap:'val_trash_auc per epoch, real log. The dot is the epoch that was saved.',src:['ckpt']};},
valauc:n=>({title:`Validation AUC: ${n.head.id} head`,what:`<p>For each of this head’s classes: take all of its own validation tiles, and ask how well the scores rank the tiles that have the class above those that do not. 1.0 is a perfect ranking, 0.5 is guessing. The classes are averaged.</p><p>No threshold is involved: AUC only looks at the order of the scores.</p>`,why:`<p>During training the thresholds do not exist yet, so a measure that needs none is used. And because of the mask, only this head’s own tiles count.</p>`,src:['losses']}),
valacc:()=>({title:'Validation accuracy: viewpoint',what:`<p>The share of validation tiles whose highest viewpoint score matches their dataset. It is written to the log every epoch.</p>`,why:`<p>It is only logged. It reaches about 99% within the first epochs and stays there, so it would say nothing about whether the debris heads are still improving.</p>`,src:['losses']}),
valtrash:()=>({title:'Validation AUC: trash neuron',what:`<p>The same ranking measure for the single trash neuron. It is written to the log every epoch.</p>`,why:`<p>Reported, not monitored: the saved model is chosen on the class outputs. The trash neurons are a helper, and their scores were compared afterwards.</p>`,src:['losses']}),
monitor:()=>{const L=D.log[mode];return{title:'val_trash_auc: the number that decides',what:`<p>The plain average of the four debris heads’ validation AUC. One number per epoch.</p><p>Despite the name, it is built from the <b>class outputs</b> of the four heads, not from the trash neurons.</p><p>Best in the real run: ${L.bestVal.toFixed(4)} at epoch ${L.bestEp}.</p>`,
  why:`<p><b>Why not the total loss:</b> it mixes nine losses and is dominated by whatever is largest, not by what we care about.</p><p><b>Why a plain average:</b> every head counts the same, however many tiles its dataset has. Satellite’s ${cnt('val',SC[3])} validation tiles weigh as much as drone’s ${cnt('val',SC[2])}.</p>`,plot:'vta',plotCap:'val_trash_auc per epoch, real log',src:['trashauc']};},
lr:()=>({title:'Halve the learning rate',what:`<p>If <code>val_trash_auc</code> has not improved for 4 epochs, the learning rate is multiplied by 0.5. The CNN went from 1e-3 down to 2.5e-4 this way.</p>`,why:`<p>Big steps get near a good solution quickly but then bounce around it. Smaller steps let the weights settle.</p>`,src:['lrstop']}),
stop:()=>({title:'Early stopping',what:`<p>If <code>val_trash_auc</code> has not improved for 8 epochs, training ends.</p>`,why:`<p>More epochs after that point only fit the training tiles more tightly. Stopping saves hours, and the checkpoint already holds the best epoch.</p>`,src:['lrstop']}),
tune:()=>({title:'Tuning the thresholds',what:`<p>Done once, after training, in <code>5_evaluate</code>. For every class of every head:</p><ol><li>Take that head’s own validation tiles and the scores for the class.</li><li>Try every cut-off on a fine grid.</li><li>Keep the cut-off with the best F1.</li></ol><p>The result is saved as <code>thresholds.json</code>: 43 numbers, one per class. Switch to <b>Test</b> or <b>Use it</b> to see them as ticks on the output bars.</p>`,why:`<p>Focal loss keeps scores small, and rare classes score lower than common ones, so a single 0.5 line would miss almost everything.</p><p><b>Why on validation:</b> choosing cut-offs with the test answers in hand would make the test score look better than it is.</p>`,plot:'decide',small:true,plotCap:'bar: a score · tick: the cut-off that is being tuned',src:['best_threshold','thr_loop']}),
thr:n=>({title:`Thresholds: ${n.head.id} head`,what:`<p>Each class has its own cut-off, tuned on the validation set and stored in <code>thresholds.json</code>. ${phase==='use'?'The app loads the same file.':'They are applied to the test scores unchanged.'}</p>`,why:`<p>A sigmoid score is only a number between 0 and 1. A decision needs a line. Rare, hard classes get a low line; common, clear ones a higher line.</p>`,after:thrTable(n.head),src:phase==='use'?['app_photo']:['thr_loop']}),
trashthr:n=>phase==='use'?{title:'Trash neuron: is it at least 0.5?',what:`<p>In the app the trash neuron’s score is used as it is. The photo’s trash probability is the highest score among its tiles, and the verdict line is 0.5.</p>`,why:`<p>A plain middle line keeps the demo simple to explain. The evaluation tuned a separate cut-off for each head’s trash neuron; the app does not use those.</p>`,src:['app_trash']}
 :{title:`Trash neuron threshold: ${n.head.id}`,what:`<p>The evaluation tunes one cut-off for the trash neuron on validation, the same way as for the classes. For this head it is ${D.neuron[mode][n.head.id][5].toFixed(2)}.</p>`,why:`<p>The same rule as for the class outputs: choose on validation, apply once to test.</p>`,src:['best_threshold']},
vparg:()=>phase==='use'?INFO.chooser():{title:'Viewpoint: highest score',what:`<p>The viewpoint prediction is the output with the highest score. It is compared with the tile’s real dataset.</p><p>Result on the test set: ${mode==='cnn'?'99.5%':'99.6%'} correct.</p>`,why:`<p>In testing this is measured but not used: each head is scored on its own dataset’s tiles whatever the viewpoint head says. The number tells you how often the web app would pick the right head.</p>`,src:['head_data']},
decide:()=>{const S=SC[scen],f=foundList();return{title:'Yes or no',what:`<p>Every score is compared with its class’s threshold: at or above is “yes”, below is “no”. One line of code turns the whole table of scores into a table of 0s and 1s.</p><p>For this ${S.ds} tile: ${f.length?f.map(x=>`${x[0]} (${x[1].toFixed(2)} ≥ ${x[2].toFixed(2)})`).join(', '):'no class passes'}.</p>`,why:`<p>Precision, recall and F1 count right and wrong decisions, so they need decisions, not scores. Only ROC-AUC works on the raw scores.</p>`,plot:'decide',small:true,src:['evaluate']};},
metrics:()=>({title:'The metrics',what:`<p>The yes/no answers are compared with the labels, class by class:</p><ul><li><b>Precision:</b> of the tiles the model flagged, how many really had the class.</li><li><b>Recall:</b> of the tiles that really had it, how many the model found.</li><li><b>F1:</b> the balance of the two; low if either is low.</li><li><b>ROC-AUC:</b> how well the raw scores rank positives above negatives, at any threshold.</li><li><b>Accuracy:</b> the share of all yes/no answers that were right.</li></ul><p><b>Macro</b> means each class counts equally in the average, so rare classes matter as much as common ones.</p>`,
  why:`<p>Accuracy looks high for every head because most classes are absent from most tiles: answering “no” to everything is already right almost every time. F1 and ROC-AUC are the numbers that show real skill.</p>`,src:['evaluate']}),
results:()=>({title:'Results on the test set',what:`<p>The real numbers for the model selected at the top.</p>${resTable()}`,why:`<p>Read AUC and F1 first. Accuracy is high everywhere because most classes are absent from most tiles. Precision is the weak column: with low thresholds the model flags a class often, so many flags are wrong.</p>`,src:['test_loop']}),
cm:()=>{const b=D.binary[mode].underwater;return{title:'Confusion matrix',what:`<p>Four counts for one yes/no question:</p><ul><li><b>True positive:</b> said yes, was yes.</li><li><b>False positive:</b> said yes, was no.</li><li><b>False negative:</b> said no, was yes.</li><li><b>True negative:</b> said no, was no.</li></ul><p>Real example, underwater “any trash?” worked out from the class scores: ${fmt(b[0])} true positives, ${fmt(b[1])} false positives, ${fmt(b[2])} false negatives, ${fmt(b[3])} true negatives.</p><p>For the multi-label heads there is one such 2 × 2 table per class; for viewpoint a single 4 × 4 table.</p>`,why:`<p>Precision and recall are just these counts divided: precision = TP ÷ (TP + FP), recall = TP ÷ (TP + FN). The table shows which kind of mistake the model makes.</p>`,plot:'cmx',small:true};},
roc:()=>({title:'ROC curve',what:`<p>Slide the threshold from 1 down to 0. At each position, plot the share of real positives caught against the share of negatives wrongly flagged. The area under that curve is ROC-AUC.</p>`,why:`<p>It judges the scores without committing to any threshold. 0.5 is a coin flip; 1.0 means every positive scores above every negative.</p>`}),
best:()=>{const S=SC[scen];return{title:'Best tile per class',what:`<p>A photo was cut into several tiles (${S.gridTxt}). For each class, the photo’s score is the <b>highest</b> score among its tiles. A class is reported if that score passes its threshold.</p>`,why:`<p>Debris is usually in one or two tiles, not all of them. Taking the maximum means “the photo has it if any tile has it”.</p>`,src:['app_photo']};},
verdict:()=>({title:'The verdict',what:`<p>The photo’s trash probability is the highest trash-neuron score among its tiles. At 0.5 or more the app says “Trash found”, and lists the classes that passed their thresholds with their scores.</p>`,why:`<p>The trash neuron was trained on exactly this yes/no question, so it gives a cleaner single answer than adding up the class scores.</p>`,src:['app_trash','app_verdict']}),
overlay:()=>({title:'Red overlay',what:`<p>Each tile is tinted red in proportion to its own trash probability, and labelled with that probability and its strongest class. The result shows roughly <i>where</i> in the photo the trash is.</p>`,why:`<p>The network is a classifier, not a detector: it cannot draw boxes. Tile-level tinting is the closest it gets to pointing.</p>`,src:['app_overlay']}),
};

/* ---------- the walkthrough ---------- */
function steps(){const S=SC[scen],Pr=probs(),m=mode==='cnn',A=[],f=foundList(),fl=f.map(x=>`${x[0]} ${x[1].toFixed(2)}`).join(', ')||'nothing above its threshold',oth=SC.filter(s=>s!==S).map(s=>s.key);
  if(phase==='train')A.push(['ds'+scen,`A ${S.ds} tile is drawn`,`It shows ${S.what}. Its row in the manifest says source = “${S.src}” and lists its labels.`],['batch','It joins a balanced batch','96 tiles: 26 underwater, 26 shore, 23 drone, 21 satellite.'],['resize','It is fitted to 320 × 320','A random 90–100% crop, then resized.'],['aug','It is changed a little','Maybe a mirror flip, a small tilt, a brightness change. Next time it will look slightly different.']);
  else if(phase==='use')A.push(['photo','A photo is uploaded','No dataset name, no labels. The app does not know it shows '+S.what+'.'],['grid','Pass 1, then pass 2','First the whole photo goes through to find the viewpoint. Then it is cut ('+S.gridTxt+') and the tiles go through.'],['resize','Fitted to 320 × 320','The whole photo in pass 1, each tile in pass 2.']);
  else A.push(['ds'+scen,`A ${S.ds} ${phase==='val'?'validation':'test'} tile`,`It shows ${S.what}. The network has never trained on it.`],['evalset','Tiles go through in order','Every tile once. No shuffling, no balancing.'],['resize','It is fitted to 320 × 320','Only resized. No random crop, no flip.']);
  A.push(['input','The tile enters the network','320 × 320 pixels, 3 colours: 307,200 numbers.'],['rescale','The numbers are made small','0…255 becomes −1…+1. Same picture.']);
  if(m)A.push(['b1_conv','Block 1: 32 filters slide over the tile','Each filter leaves a map of where its pattern is. An edge filter lights up outlines.'],['b1_bn','BatchNorm centres every map',phase==='train'?'Same picture, but the values now sit around 0 with a spread of 1.':'It uses the averages it remembered from training, not this batch.'],['b1_lrelu','LeakyReLU bends the values','Positives pass. Negatives are cut to a tenth.'],['b1_pool','Max pooling halves the map','320 → 160. Only the strongest response in each 2 × 2 square survives.'],['t1','32 maps of 160 × 160','Smaller in front, deeper behind. This is what block 2 reads.'],['b2','Block 2: patterns of patterns','64 filters combine block 1’s edges into corners and textures. Out: 80 × 80 × 64.'],['b3','Block 3: parts of things','128 filters. Out: 40 × 40 × 128.'],['b4','Block 4: object-like patterns','256 filters, each cell having seen a 46 × 46 pixel patch. Out: 20 × 20 × 256.']);
  else A.push(['mn_frozen','The frozen layers find general features','Edges, colours and textures, with weights learned on ImageNet and never changed by us. Out: 20 × 20 × 96.'],['mn_tuned','The last blocks find specific features',phase==='train'?'These are the layers we fine-tune in stage 2. Out: 10 × 10 × 1,280.':'Out: 10 × 10 × 1,280.']);
  A.push(['pool','Position is thrown away',m?'Each of the 256 maps becomes its average and its maximum: 512 numbers.':'1,280 averages and 1,280 maximums: 2,560 numbers.'],['pbn','One scale for all of them','BatchNorm centres them, ready for the heads.'],['heads','All five heads read the same numbers','They compute in parallel. None knows what the others say.'],
   ['h_viewpoint',`Viewpoint head: “${S.key}”, ${Pr.vp[scen].toFixed(2)}`,phase==='use'?'This is pass 1’s whole purpose. The answer now decides the grid and the head.':'Softmax: the four scores add up to 1.'],
   ['h_'+S.key,`${S.key[0].toUpperCase()+S.key.slice(1)} head answers`,phase==='train'?`Its scores are compared with the labels: ${S.present.join(', ')} should be 1.`:`Against its thresholds: ${fl}. Trash neuron: ${Pr.t[S.key].toFixed(2)}.`],
   ['h_'+oth[0],'The other three heads',`${oth.join(', ')}: they produced numbers too, but they never learned from ${S.key} pictures, so their numbers mean nothing here.`]);
  if(phase==='train')A.push(['mask','The loss mask',`Viewpoint 1, ${S.key} 1, the other three 0. The head is picked from the dataset name, not from the viewpoint head’s answer.`],['gate_'+S.key,`The ${S.key} gate is open`,'Its loss counts in full. The three closed gates multiply their losses by 0.'],['m_'+S.key,'Focal loss for the class outputs','How far the scores are from the labels, with easy answers shrunk.'],['total','One number: the total loss',`0.5 × viewpoint + 1.0 × ${S.key} focal + 0.5 × ${S.key} trash. The masked heads add 0.`],['adamw','AdamW corrects the weights',`The error flows back through the ${S.key} and viewpoint heads into the backbone. Each weight moves a tiny step. Then the next batch arrives.`]);
  else if(phase==='val')A.push(['mask','The same mask, for counting',`This tile counts toward the ${S.key} head’s score and the viewpoint score only.`],['m_'+S.key,`${S.key} AUC`,'After all validation tiles are through: how well do this head’s scores rank its own tiles?'],['monitor','val_trash_auc','The four heads’ AUCs averaged into one number for this epoch.'],['ckpt','Best so far? Save it','If the number beats every earlier epoch, the model file is overwritten.'],['lever','The satellite lever watches','It looks only at satellite’s AUC, and freezes that head after 8 epochs without a new best.'],['tune','After training: thresholds','The same validation tiles are used once more to pick each class’s cut-off.']);
  else if(phase==='test')A.push(['mask','Own head only',`The manifest says ${S.ds}, so this tile is scored by the ${S.key} head.`],['m_'+S.key,'Thresholds from validation','One cut-off per class, loaded unchanged.'],['decide','Yes or no',fl+'.'],['metrics','Compared with the labels','Over all test tiles: precision, recall, F1, ROC-AUC, accuracy.'],['results','The reported numbers','One row per head. This is the table in the report.']);
  else A.push(['mask','The viewpoint picks the head',`“${S.key}” won, so the ${S.key} head is read and the photo is cut as ${S.gridTxt}.`],['m_'+S.key,'Thresholds','The same file the evaluation wrote.'],['best','Best tile per class','A class is found if any tile passes its threshold.'],['verdict','The verdict',`Trash neuron ${Pr.t[S.key].toFixed(2)} ≥ 0.5: “Trash found”. Classes: ${fl}.`]);
  return A;}
